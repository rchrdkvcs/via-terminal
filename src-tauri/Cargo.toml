[package]
name = "via-terminal"
version = "0.2.1"
description = "A workspace-oriented native terminal"
authors = ["via terminal contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "via_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
thiserror = "2"
dirs = "6"
base64 = "0.22"
keyring = "4"
chacha20poly1305 = "0.10"
zeroize = "1.9.0"
async-trait = "0.1.92"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net"] }
rand = "0.10"
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"
