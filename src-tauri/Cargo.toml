[package]
name = "via-terminal"
version = "0.2.1"
description = "A workspace-oriented native terminal"
authors = ["via terminal contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "via_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
thiserror = "2"
dirs = "6"
shlex = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
