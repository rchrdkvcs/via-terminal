[package]
name = "via-terminal"
version = "0.2.1"
description = "A workspace-oriented native terminal"
authors = ["via terminal contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "via_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
thiserror = "2"
dirs = "6"
base64 = "0.22"
keyring = "4"
chacha20poly1305 = "0.10"
zeroize = "1.9.0"
async-trait = "0.1.92"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net", "fs", "io-util"] }
rand = "0.10"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"
russh-sftp = "3"
tauri-plugin-dialog = "2"
ts-rs = { version = "12", features = ["uuid-impl", "no-serde-warnings"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSEvent",
  "NSGraphics",
  "NSHapticFeedback",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[dev-dependencies]
tempfile = "3"
