name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/frontend-quality

  native:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # CI diagnostics use compiler messages, not native debugger symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-quality

  # Preserve the existing required "quality" check as the combined gate.
  quality:
    needs: [frontend, native]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require both quality jobs to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$FRONTEND_RESULT" = success && test "$NATIVE_RESULT" = success
